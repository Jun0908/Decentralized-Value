[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fuzz = { runs = 256 }
invariant = { runs = 128, depth = 32 }
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
