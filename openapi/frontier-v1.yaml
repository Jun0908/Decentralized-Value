openapi: 3.1.0
info:
  title: Frontier Protocol API
  version: 1.0.0
  description: Reproducible Pareto-frontier discovery and asynchronous evaluation.
servers: [{ url: "/" }]
paths:
  /v1/health:
    get: { operationId: getHealth, responses: { "200": { description: Healthy } } }
  /v1/arenas:
    get: { operationId: listArenas, responses: { "200": { description: Arena list } } }
  /v1/emergency-supply:
    get:
      operationId: getEmergencySupplyScenario
      description: Returns the versioned suppliers, capacities, routes, failure cases, and baseline frontier.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-normal-operations, public-port-constrained] }
      responses: { "200": { description: Public emergency-supply scenario } }
  /v1/emergency-supply/evaluations:
    post:
      operationId: evaluateEmergencySupplyAllocation
      description: Deterministically calculates cost, enumerates every single failure, and compares a user allocation with the baseline Pareto frontier.
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: "#/components/schemas/SupplyEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured allocation with failure evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/emergency-supply/replay:
    get:
      operationId: replayEmergencySupplyAgents
      description: Recalculates three reference agent submissions with the public evaluator, derives the final participant frontier, and allocates 10,000 deterministic practice credits by exclusive contribution.
      responses:
        {
          "200":
            { description: Deterministic Agent A/B/C replay, frontier, rewards, and replay hash },
        }
  /v1/challenges/emergency-supply:
    get:
      operationId: getEmergencySupplyCompetition
      description: Returns the Plan 5 demo round, availability flags, public rules, and counts.
      responses: { "200": { description: Emergency Supply competition lobby } }
  /v1/challenges/emergency-supply/starter-kit:
    get:
      operationId: downloadEmergencySupplyStarterKit
      description: Downloads the challenge manifest, vendors, failure scenarios, sample submission, and instructions as a ZIP archive.
      responses:
        "200":
          {
            description: Emergency Supply starter ZIP,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
  /v1/challenges/emergency-supply/leaderboard:
    get:
      operationId: getEmergencySupplyLeaderboard
      description: Recalculates the common frontier, dominated reasons, contribution, and reward preview from seed agents and latest participant revisions.
      responses: { "200": { description: Live frontier leaderboard } }
  /v1/challenges/emergency-supply/join:
    post:
      operationId: joinEmergencySupplyCompetition
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Authenticated participant created or restored },
          "401": { description: Privy token missing or invalid },
          "503": { description: Server authentication or durable storage unavailable },
        }
  /v1/challenges/emergency-supply/submissions:
    post:
      operationId: submitEmergencySupplyRevision
      security: [{ PrivyAccessToken: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan5SubmissionInput" } } },
        }
      responses:
        {
          "201": { description: Persisted and evaluated revision },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { description: Privy token missing or invalid },
        }
  /v1/challenges/emergency-supply/submissions/mine:
    get:
      operationId: getMyEmergencySupplySubmissions
      security: [{ PrivyAccessToken: [] }]
      responses: { "200": { description: Participant, revisions, and selected Final Entry } }
  /v1/challenges/emergency-supply/final-entry:
    put:
      operationId: selectEmergencySupplyFinalEntry
      security: [{ PrivyAccessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Current Final Entry saved } }
  /v1/challenges/emergency-supply/demo-settlement:
    post:
      operationId: settleEmergencySupplyDemoReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Sepolia RewardPaid receipt persisted },
          "409": { description: No valid rewarding Final Entry },
          "503": { description: Capped Sepolia relayer unavailable },
        }
  /v1/challenges/emergency-supply/reward/mine:
    get:
      operationId: getMyEmergencySupplyReward
      security: [{ PrivyAccessToken: [] }]
      responses: { "200": { description: Current reward and transaction state } }
  /v1/disaster-response:
    get:
      operationId: getDisasterResponseScenario
      description: Returns the 72-hour logistics network, suppliers, regions, public training scenarios, and committed final-scenario hash.
      responses: { "200": { description: Public disaster-response scenario } }
  /v1/disaster-response/evaluations:
    post:
      operationId: practiceDisasterResponseStrategy
      description: Runs a deterministic practice evaluation without joining or persisting a submission.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DisasterResponseStrategy" } },
            },
        }
      responses:
        {
          "200":
            { description: Strategy outcome, scenario replay, hashes, and frontier comparison },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/challenges/disaster-response:
    get:
      operationId: getDisasterResponseCompetition
      description: Returns the Plan 6 instant demo round, storage/authentication/settlement availability, rules, and scenario.
      responses: { "200": { description: Disaster-response competition lobby } }
  /v1/challenges/disaster-response/starter-kit:
    get:
      operationId: downloadDisasterResponseStarterKit
      responses:
        "200":
          {
            description: Manifest,
            network,
            training scenarios,
            schema,
            sample strategy,
            and instructions as ZIP,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
  /v1/challenges/disaster-response/leaderboard:
    get:
      operationId: getDisasterResponseLeaderboard
      description: Compares selected Final Entries with public benchmarks and allocates independent Value Pools without producing an overall rank.
      responses:
        { "200": { description: Three-axis frontier, Value Pool allocations, and reward previews } }
  /v1/challenges/disaster-response/value-pools:
    post:
      operationId: publishDisasterResponseValuePool
      description: Publishes one authenticated practice Protect a Region Value Pool. It allocates demo credits and does not fund or transfer Sepolia tokens.
      security: [{ PrivyAccessToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan6ValuePoolInput" } } },
        }
      responses:
        {
          "201": { description: Practice Value Pool manifest persisted },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { description: Privy token missing or invalid },
          "409": { description: This account already published its practice Value Pool },
        }
  /v1/challenges/disaster-response/join:
    post:
      operationId: joinDisasterResponseCompetition
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Authenticated participant created or restored },
          "401": { description: Privy token missing or invalid },
          "503": { description: Authentication or durable storage unavailable },
        }
  /v1/challenges/disaster-response/submissions:
    post:
      operationId: submitDisasterResponseRevision
      security: [{ PrivyAccessToken: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan6SubmissionInput" } } },
        }
      responses:
        {
          "201": { description: Persisted and evaluated strategy revision },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { description: Privy token missing or invalid },
        }
  /v1/challenges/disaster-response/submissions/mine:
    get:
      operationId: getMyDisasterResponseSubmissions
      security: [{ PrivyAccessToken: [] }]
      responses: { "200": { description: Participant, revisions, and selected Final Entry } }
  /v1/challenges/disaster-response/final-entry:
    put:
      operationId: selectDisasterResponseFinalEntry
      security: [{ PrivyAccessToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [submissionId],
                      properties: { submissionId: { $ref: "#/components/schemas/Bytes32" } },
                      additionalProperties: false,
                    },
                },
            },
        }
      responses: { "200": { description: Current Final Entry saved } }
  /v1/challenges/disaster-response/demo-settlement:
    post:
      operationId: settleDisasterResponseDemoReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Committed Value Pool allocation paid and persisted },
          "409": { description: No valid rewarding Final Entry },
          "503": { description: Capped Sepolia relayer unavailable },
        }
  /v1/challenges/disaster-response/reward/mine:
    get:
      operationId: getMyDisasterResponseReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "200":
            {
              description: Value Pool breakdown,
              allocation evidence,
              reward amount,
              recipient,
              and transaction state,
            },
        }
  /v1/calldata-compression:
    get:
      operationId: getCalldataCompressionScenario
      description: Returns the fixed batches, compiler and Cancun EVM rules, reference codecs, and measured baseline points.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-transfer-mix, public-low-reuse] }
      responses: { "200": { description: Public calldata-compression scenario } }
  /v1/calldata-compression/evaluations:
    post:
      operationId: evaluateCalldataCodec
      description: Encodes every public batch, applies exact EIP-2028 byte pricing, executes Solidity runtime bytecode in a Cancun EVM, and compares both gas axes.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CalldataEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured codec with per-batch EVM evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/microgrid-dispatch:
    get:
      operationId: getMicrogridDispatchScenario
      description: Returns the deterministic three-axis practice context and baselines.
      responses: { "200": { description: Public microgrid-dispatch scenario } }
  /v1/microgrid-dispatch/evaluations:
    post:
      operationId: evaluateMicrogridDispatch
      description: Measures cost, worst-case energy delivery, and carbon while enforcing all constraints.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MicrogridEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured three-axis outcome and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v2/sandbox/participants/register:
    post:
      operationId: registerSandboxParticipant
      description: Idempotently registers a wallet address in ephemeral demo memory. It does not prove ownership or personhood.
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/SandboxRegistration" } } },
        }
      responses: { "201": { description: Ephemeral wallet-only participant } }
  /v2/sandbox/submissions:
    post:
      operationId: createSandboxSubmission
      description: Evaluates and records one ephemeral revision. Private source is rejected until encrypted storage exists.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        {
          "201": { description: Measured submission revision },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v2/sandbox/participants/{participantId}/submissions:
    get:
      operationId: listSandboxSubmissions
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Bytes32" }
      responses: { "200": { description: Ephemeral revision history } }
  /v2/sandbox/final-entry:
    put:
      operationId: selectSandboxFinalEntry
      description: Selects one revision as the current final entry. Sandbox entries are not deadline-frozen.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Selected but unfrozen final entry } }
  /v1/arenas/{id}:
    get:
      operationId: getArena
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Arena }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/arenas/{id}/frontier:
    get:
      operationId: getArenaFrontier
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Non-dominated artifacts } }
  /v1/challenges/{id}:
    get:
      operationId: getChallenge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Challenge }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/challenges/{id}/frontier:
    get:
      operationId: getFrontier
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Non-dominated artifacts } }
  /v1/challenges/{id}/artifacts:
    get:
      operationId: listArtifacts
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Evaluated artifacts } }
  /v1/challenges/{id}/attestations:
    get:
      operationId: listAttestations
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Signed attestations } }
  /v1/challenges/{id}/disputes:
    post:
      operationId: createDispute
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/DisputeInput" } } },
        }
      responses:
        {
          "201": { description: Dispute recorded },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/artifacts:
    post:
      operationId: createArtifact
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        {
          "201": { description: Artifact registered },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/artifacts/{id}:
    get:
      operationId: getArtifact
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Artifact }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/evaluations:
    post:
      operationId: evaluateArtifact
      description: Paid/gated operation when routed through the Bazantic 402/MPP gateway.
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/EvaluationInput" } } },
        }
      responses:
        "202":
          {
            description: Evaluation accepted. Public demo deployments return a clearly labeled simulated terminal state without a signature or transaction.,
            headers: { Location: { schema: { type: string } } },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { description: Payment required at the Bazantic gateway }
  /v1/evaluations/{jobId}:
    get:
      operationId: getEvaluation
      parameters:
        [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          "200": { description: Evaluation state, including simulated demo results },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /v1/runners:
    get: { operationId: listRunners, responses: { "200": { description: Live ENS runners } } }
  /v1/runners/{ensName}:
    get:
      operationId: getRunner
      parameters:
        [
          {
            name: ensName,
            in: path,
            required: true,
            schema: { type: string, pattern: ".+\\.eth$" },
          },
        ]
      responses:
        {
          "200": { description: ENS runner },
          "503": { description: ENS unavailable or unconfigured },
        }
components:
  securitySchemes:
    PrivyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Bytes32" } }
  schemas:
    Bytes32: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
    EvaluationInput:
      type: object
      required: [artifactId]
      properties: { artifactId: { $ref: "#/components/schemas/Bytes32" } }
      additionalProperties: false
    SupplyEvaluationInput:
      type: object
      required: [allocations]
      properties:
        contextId: { type: string, enum: [public-normal-operations, public-port-constrained] }
        allocations:
          type: object
          required: [harbor-aid, northstar, inland-works, local-grid, airbridge]
          properties:
            harbor-aid: { type: integer, minimum: 0 }
            northstar: { type: integer, minimum: 0 }
            inland-works: { type: integer, minimum: 0 }
            local-grid: { type: integer, minimum: 0 }
            airbridge: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    Plan5SubmissionInput:
      type: object
      required: [allocations, sourceMethod]
      properties:
        allocations:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        sourceMethod: { type: string, enum: [VISUAL, JSON, UPLOAD] }
        repositoryUrl: { type: [string, "null"], format: uri }
        sourceCommit: { type: [string, "null"], pattern: "^[0-9a-f]{40}$" }
      additionalProperties: false
    DisasterResponseStrategy:
      type: object
      required:
        [
          schemaVersion,
          name,
          primarySupplierOrder,
          emergencySupplierOrder,
          regionPolicy,
          reserveKits,
          emergencyBudgetUsd,
        ]
      properties:
        schemaVersion: { type: string, const: "2" }
        name: { type: string, minLength: 1, maxLength: 80 }
        primarySupplierOrder:
          {
            type: array,
            minItems: 5,
            maxItems: 5,
            items: { $ref: "#/components/schemas/DisasterSupplierId" },
          }
        emergencySupplierOrder:
          {
            type: array,
            minItems: 5,
            maxItems: 5,
            items: { $ref: "#/components/schemas/DisasterSupplierId" },
          }
        regionPolicy: { type: string, enum: [deadline-first, highest-need, equalize-coverage] }
        reserveKits: { type: integer, minimum: 0, maximum: 300 }
        emergencyBudgetUsd: { type: integer, minimum: 0, maximum: 25000 }
      additionalProperties: false
    DisasterSupplierId:
      { type: string, enum: [harbor-aid, northstar, inland-works, local-grid, airbridge] }
    Plan6SubmissionInput:
      type: object
      required: [strategy, sourceMethod]
      properties:
        strategy: { $ref: "#/components/schemas/DisasterResponseStrategy" }
        sourceMethod: { type: string, enum: [VISUAL, JSON, UPLOAD] }
        repositoryUrl: { type: [string, "null"], format: uri }
        sourceCommit: { type: [string, "null"], pattern: "^[0-9a-f]{40}$" }
      additionalProperties: false
    Plan6ValuePoolInput:
      type: object
      required: [name, valueStatement, regionId, poolCredits]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        valueStatement: { type: string, minLength: 10, maxLength: 180 }
        regionId: { type: string, enum: [coast, river, highland, south] }
        poolCredits: { type: integer, minimum: 100, maximum: 2500 }
      additionalProperties: false
    CalldataEvaluationInput:
      type: object
      required: [codecId]
      properties:
        codecId: { type: string, enum: [abi, packed, dictionary] }
        contextId: { type: string, enum: [public-transfer-mix, public-low-reuse] }
      additionalProperties: false
    MicrogridEvaluationInput:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 1000000 }
      additionalProperties: false
    SandboxRegistration:
      type: object
      required: [challengeId, wallet]
      properties:
        challengeId:
          {
            type: string,
            enum: [emergency-supply-v1, calldata-compression-v1, microgrid-dispatch-v1],
          }
        wallet: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
      additionalProperties: false
    DisputeInput:
      type: object
      required: [artifactId, reason]
      properties:
        artifactId: { $ref: "#/components/schemas/Bytes32" }
        reason: { type: string, minLength: 10, maxLength: 2000 }
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
  responses:
    BadRequest:
      {
        description: Invalid input,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    NotFound:
      {
        description: Resource not found,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
