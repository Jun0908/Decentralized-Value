components:
  securitySchemes:
    PrivyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PrivyIdentityToken:
      type: apiKey
      in: header
      name: x-privy-identity-token
    CliSession:
      type: http
      scheme: bearer
      bearerFormat: opaque frontier_cli_ session
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Bytes32" } }
  schemas:
    Bytes32: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
    SecretGateEnrollment:
      type: object
      required: [commitment]
      properties:
        commitment: { type: string, pattern: "^[1-9][0-9]*$" }
      additionalProperties: false
    SemaphoreProof:
      type: object
      required: [merkleTreeDepth, merkleTreeRoot, message, nullifier, scope, points]
      properties:
        merkleTreeDepth: { type: integer, minimum: 1, maximum: 32 }
        merkleTreeRoot: { type: string, pattern: "^[1-9][0-9]*$" }
        message: { type: string, pattern: "^[1-9][0-9]*$" }
        nullifier: { type: string, pattern: "^[1-9][0-9]*$" }
        scope: { type: string, pattern: "^[1-9][0-9]*$" }
        points:
          { type: array, minItems: 8, maxItems: 8, items: { type: string, pattern: "^[0-9]+$" } }
      additionalProperties: false
    SecretGateEntry:
      type: object
      required: [gateId, epoch, proof]
      properties:
        gateId: { type: string, const: public-demo-gate }
        epoch: { type: string, const: 2026-09-demo-1 }
        proof: { $ref: "#/components/schemas/SemaphoreProof" }
      additionalProperties: false
    EvaluationInput:
      type: object
      required: [artifactId]
      properties: { artifactId: { $ref: "#/components/schemas/Bytes32" } }
      additionalProperties: false
    SupplyEvaluationInput:
      type: object
      required: [allocations]
      properties:
        contextId: { type: string, enum: [public-normal-operations, public-port-constrained] }
        allocations:
          type: object
          required: [harbor-aid, northstar, inland-works, local-grid, airbridge]
          properties:
            harbor-aid: { type: integer, minimum: 0 }
            northstar: { type: integer, minimum: 0 }
            inland-works: { type: integer, minimum: 0 }
            local-grid: { type: integer, minimum: 0 }
            airbridge: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    Plan5SubmissionInput:
      type: object
      required: [allocations, sourceMethod]
      properties:
        allocations:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        sourceMethod: { type: string, enum: [VISUAL, JSON, UPLOAD] }
        repositoryUrl: { type: [string, "null"], format: uri }
        sourceCommit: { type: [string, "null"], pattern: "^[0-9a-f]{40}$" }
      additionalProperties: false
    DisasterResponseStrategy:
      type: object
      properties:
        schemaVersion:
          type: string
          const: "2"
        name:
          type: string
          minLength: 1
          maxLength: 80
        primarySupplierOrder:
          minItems: 5
          maxItems: 5
          type: array
          items:
            type: string
            enum:
              - harbor-aid
              - northstar
              - inland-works
              - local-grid
              - airbridge
        emergencySupplierOrder:
          minItems: 5
          maxItems: 5
          type: array
          items:
            type: string
            enum:
              - harbor-aid
              - northstar
              - inland-works
              - local-grid
              - airbridge
        regionPolicy:
          type: string
          enum:
            - deadline-first
            - highest-need
            - equalize-coverage
        reserveKits:
          type: integer
          minimum: 0
          maximum: 300
        emergencyBudgetUsd:
          type: integer
          minimum: 0
          maximum: 25000
      required:
        - schemaVersion
        - name
        - primarySupplierOrder
        - emergencySupplierOrder
        - regionPolicy
        - reserveKits
        - emergencyBudgetUsd
      additionalProperties: false
    DisasterSupplierId:
      { type: string, enum: [harbor-aid, northstar, inland-works, local-grid, airbridge] }
    Plan6SubmissionInput:
      type: object
      properties:
        strategy:
          type: object
          properties:
            schemaVersion:
              type: string
              const: "2"
            name:
              type: string
              minLength: 1
              maxLength: 80
            primarySupplierOrder:
              minItems: 5
              maxItems: 5
              type: array
              items:
                type: string
                enum:
                  - harbor-aid
                  - northstar
                  - inland-works
                  - local-grid
                  - airbridge
            emergencySupplierOrder:
              minItems: 5
              maxItems: 5
              type: array
              items:
                type: string
                enum:
                  - harbor-aid
                  - northstar
                  - inland-works
                  - local-grid
                  - airbridge
            regionPolicy:
              type: string
              enum:
                - deadline-first
                - highest-need
                - equalize-coverage
            reserveKits:
              type: integer
              minimum: 0
              maximum: 300
            emergencyBudgetUsd:
              type: integer
              minimum: 0
              maximum: 25000
          required:
            - schemaVersion
            - name
            - primarySupplierOrder
            - emergencySupplierOrder
            - regionPolicy
            - reserveKits
            - emergencyBudgetUsd
          additionalProperties: false
        sourceMethod:
          type: string
          enum:
            - VISUAL
            - JSON
            - UPLOAD
            - AGENT_API
        repositoryUrl:
          default: null
          anyOf:
            - type: string
              format: uri
              pattern: ^https:\/\/github\.com\/.*
            - type: "null"
        sourceCommit:
          default: null
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{40}$
            - type: "null"
        agentEvidence:
          default: null
          anyOf:
