      type: object
      required: [schemaVersion, name, constraints, rules]
      properties:
        schemaVersion: { type: string, enum: [rescue-doctrine-v0] }
        name: { type: string, minLength: 3, maxLength: 80 }
        constraints:
          type: object
          required:
            [
              investigationBudgetCredits,
              maxServicePriceCredits,
              allowedServiceIds,
              allowedProtocolActions,
            ]
          properties:
            investigationBudgetCredits: { type: integer, minimum: 0, maximum: 100 }
            maxServicePriceCredits: { type: integer, minimum: 0, maximum: 100 }
            allowedServiceIds:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 6
              items:
                {
                  type: string,
                  enum:
                    [
                      pulse-monitor,
                      trace-audit,
                      accounting-audit,
                      second-opinion,
                      patch-builder,
                      patch-verifier,
                    ],
                }
            allowedProtocolActions:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 7
              items:
                {
                  type: string,
                  enum:
                    [
                      PAUSE_MODULE,
                      PAUSE_PROTOCOL,
                      APPLY_PATCH,
                      RESUME_MODULE,
                      RESUME_PROTOCOL,
                      WAIT,
                      CLOSE_INCIDENT,
                    ],
                }
          additionalProperties: false
        rules:
          type: object
          required:
            [
              minimumEvidenceCount,
              minimumConfidencePpm,
              disagreementAction,
              containmentScope,
              servicePriority,
              requirePatchVerification,
              budgetExhaustedAction,
            ]
          properties:
            minimumEvidenceCount: { type: integer, minimum: 1, maximum: 3 }
            minimumConfidencePpm: { type: integer, minimum: 500000, maximum: 950000 }
            disagreementAction: { type: string, enum: [second-opinion, wait, contain] }
            containmentScope: { type: string, enum: [none, module, protocol] }
            servicePriority:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 4
              items:
                {
                  type: string,
                  enum: [pulse-monitor, trace-audit, accounting-audit, second-opinion],
                }
            requirePatchVerification: { type: boolean }
            budgetExhaustedAction: { type: string, enum: [wait, close, contain] }
          additionalProperties: false
      additionalProperties: false
