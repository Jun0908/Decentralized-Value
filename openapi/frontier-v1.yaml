openapi: 3.1.0
info:
  title: Frontier Protocol API
  version: 1.0.0
  description: Reproducible Pareto-frontier discovery and asynchronous evaluation.
servers: [{ url: "/" }]
paths:
  /v1/health:
    get: { operationId: getHealth, responses: { "200": { description: Healthy } } }
  /v1/arenas:
    get: { operationId: listArenas, responses: { "200": { description: Arena list } } }
  /v1/emergency-supply:
    get:
      operationId: getEmergencySupplyScenario
      description: Returns the versioned suppliers, capacities, routes, failure cases, and baseline frontier.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-normal-operations, public-port-constrained] }
      responses: { "200": { description: Public emergency-supply scenario } }
  /v1/emergency-supply/evaluations:
    post:
      operationId: evaluateEmergencySupplyAllocation
      description: Deterministically calculates cost, enumerates every single failure, and compares a user allocation with the baseline Pareto frontier.
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: "#/components/schemas/SupplyEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured allocation with failure evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/emergency-supply/replay:
    get:
      operationId: replayEmergencySupplyAgents
      description: Recalculates three reference agent submissions with the public evaluator, derives the final participant frontier, and allocates 10,000 deterministic practice credits by exclusive contribution.
      responses:
        {
          "200":
            { description: Deterministic Agent A/B/C replay, frontier, rewards, and replay hash },
        }
  /v1/calldata-compression:
    get:
      operationId: getCalldataCompressionScenario
      description: Returns the fixed batches, compiler and Cancun EVM rules, reference codecs, and measured baseline points.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-transfer-mix, public-low-reuse] }
      responses: { "200": { description: Public calldata-compression scenario } }
  /v1/calldata-compression/evaluations:
    post:
      operationId: evaluateCalldataCodec
      description: Encodes every public batch, applies exact EIP-2028 byte pricing, executes Solidity runtime bytecode in a Cancun EVM, and compares both gas axes.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CalldataEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured codec with per-batch EVM evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/microgrid-dispatch:
    get:
      operationId: getMicrogridDispatchScenario
      description: Returns the deterministic three-axis practice context and baselines.
      responses: { "200": { description: Public microgrid-dispatch scenario } }
  /v1/microgrid-dispatch/evaluations:
    post:
      operationId: evaluateMicrogridDispatch
      description: Measures cost, worst-case energy delivery, and carbon while enforcing all constraints.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MicrogridEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured three-axis outcome and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v2/sandbox/participants/register:
    post:
      operationId: registerSandboxParticipant
      description: Idempotently registers a wallet address in ephemeral demo memory. It does not prove ownership or personhood.
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/SandboxRegistration" } } },
        }
      responses: { "201": { description: Ephemeral wallet-only participant } }
  /v2/sandbox/submissions:
    post:
      operationId: createSandboxSubmission
      description: Evaluates and records one ephemeral revision. Private source is rejected until encrypted storage exists.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        {
          "201": { description: Measured submission revision },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v2/sandbox/participants/{participantId}/submissions:
    get:
      operationId: listSandboxSubmissions
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Bytes32" }
      responses: { "200": { description: Ephemeral revision history } }
  /v2/sandbox/final-entry:
    put:
      operationId: selectSandboxFinalEntry
      description: Selects one revision as the current final entry. Sandbox entries are not deadline-frozen.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Selected but unfrozen final entry } }
  /v1/arenas/{id}:
    get:
      operationId: getArena
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Arena }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/arenas/{id}/frontier:
    get:
      operationId: getArenaFrontier
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Non-dominated artifacts } }
  /v1/challenges/{id}:
    get:
      operationId: getChallenge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Challenge }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/challenges/{id}/frontier:
    get:
      operationId: getFrontier
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Non-dominated artifacts } }
  /v1/challenges/{id}/artifacts:
    get:
      operationId: listArtifacts
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Evaluated artifacts } }
  /v1/challenges/{id}/attestations:
    get:
      operationId: listAttestations
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Signed attestations } }
  /v1/challenges/{id}/disputes:
    post:
      operationId: createDispute
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "#/components/schemas/DisputeInput" } } },
        }
      responses:
        {
          "201": { description: Dispute recorded },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/artifacts:
    post:
      operationId: createArtifact
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        {
          "201": { description: Artifact registered },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/artifacts/{id}:
    get:
      operationId: getArtifact
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { description: Artifact }, "404": { $ref: "#/components/responses/NotFound" } }
  /v1/evaluations:
    post:
      operationId: evaluateArtifact
      description: Paid/gated operation when routed through the Bazantic 402/MPP gateway.
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/EvaluationInput" } } },
        }
      responses:
        "202":
          {
            description: Evaluation accepted. Public demo deployments return a clearly labeled simulated terminal state without a signature or transaction.,
            headers: { Location: { schema: { type: string } } },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { description: Payment required at the Bazantic gateway }
  /v1/evaluations/{jobId}:
    get:
      operationId: getEvaluation
      parameters:
        [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          "200": { description: Evaluation state, including simulated demo results },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /v1/runners:
    get: { operationId: listRunners, responses: { "200": { description: Live ENS runners } } }
  /v1/runners/{ensName}:
    get:
      operationId: getRunner
      parameters:
        [
          {
            name: ensName,
            in: path,
            required: true,
            schema: { type: string, pattern: ".+\\.eth$" },
          },
        ]
      responses:
        {
          "200": { description: ENS runner },
          "503": { description: ENS unavailable or unconfigured },
        }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Bytes32" } }
  schemas:
    Bytes32: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
    EvaluationInput:
      type: object
      required: [artifactId]
      properties: { artifactId: { $ref: "#/components/schemas/Bytes32" } }
      additionalProperties: false
    SupplyEvaluationInput:
      type: object
      required: [allocations]
      properties:
        contextId: { type: string, enum: [public-normal-operations, public-port-constrained] }
        allocations:
          type: object
          required: [harbor-aid, northstar, inland-works, local-grid, airbridge]
          properties:
            harbor-aid: { type: integer, minimum: 0 }
            northstar: { type: integer, minimum: 0 }
            inland-works: { type: integer, minimum: 0 }
            local-grid: { type: integer, minimum: 0 }
            airbridge: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    CalldataEvaluationInput:
      type: object
      required: [codecId]
      properties:
        codecId: { type: string, enum: [abi, packed, dictionary] }
        contextId: { type: string, enum: [public-transfer-mix, public-low-reuse] }
      additionalProperties: false
    MicrogridEvaluationInput:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 1000000 }
      additionalProperties: false
    SandboxRegistration:
      type: object
      required: [challengeId, wallet]
      properties:
        challengeId:
          {
            type: string,
            enum: [emergency-supply-v1, calldata-compression-v1, microgrid-dispatch-v1],
          }
        wallet: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
      additionalProperties: false
    DisputeInput:
      type: object
      required: [artifactId, reason]
      properties:
        artifactId: { $ref: "#/components/schemas/Bytes32" }
        reason: { type: string, minLength: 10, maxLength: 2000 }
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
  responses:
    BadRequest:
      {
        description: Invalid input,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    NotFound:
      {
        description: Resource not found,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
