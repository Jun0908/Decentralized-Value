openapi: 3.1.0
info:
  title: Frontier Protocol API
  version: 1.0.0
  description: Reproducible Pareto-frontier discovery and asynchronous evaluation.
servers: [{ url: "/" }]
paths:
  /v1/health:
    get: { operationId: getHealth, responses: { "200": { description: Healthy } } }
  /v1/arenas:
    get: { operationId: listArenas, responses: { "200": { description: Arena list } } }
  /v1/secret-gate:
    get:
      operationId: getSecretGateScenario
      description:
        Returns the fixed offchain Gate policy, bounded practice strategy, workloads, artifact
        versions, context hash, and honest evidence boundary.
      responses: { "200": { description: Public Secret Gate scenario } }
  /v1/secret-gate/enroll:
    post:
      operationId: enrollSecretGateCommitment
      description:
        Creates a short-lived synthetic eight-member group snapshot containing the submitted
        public commitment. No identity secret is accepted.
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/SecretGateEnrollment" } } },
        }
      responses:
        {
          "201": { description: Trusted 30-minute synthetic group snapshot },
          "400": { $ref: "#/components/responses/BadRequest" },
          "503": { description: Durable production storage is unavailable },
        }
  /v1/secret-gate/enter:
    post:
      operationId: verifySecretGateEntry
      description:
        Verifies a real Semaphore proof against the trusted root, fixed message and scope, then
        atomically reserves its nullifier. The result is offchain and is not an Ethereum
        transaction.
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/SecretGateEntry" } } },
        }
      responses:
        {
          "201": { description: Gate opened with offchain verification receipt },
          "400": { $ref: "#/components/responses/BadRequest" },
          "409": { description: Nullifier was already used for this Gate scope },
          "503": { description: Durable production storage is unavailable },
        }
  /v1/emergency-supply:
    get:
      operationId: getEmergencySupplyScenario
      description: Returns the versioned suppliers, capacities, routes, failure cases, and baseline frontier.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-normal-operations, public-port-constrained] }
      responses: { "200": { description: Public emergency-supply scenario } }
  /v1/emergency-supply/evaluations:
    post:
      operationId: evaluateEmergencySupplyAllocation
      description:
        Deterministically calculates cost, enumerates every single failure, and compares a user
        allocation with the baseline Pareto frontier.
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: "#/components/schemas/SupplyEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured allocation with failure evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/emergency-supply/replay:
    get:
      operationId: replayEmergencySupplyAgents
      description:
        Recalculates three reference agent submissions with the public evaluator, derives the
        final participant frontier, and allocates 10,000 deterministic practice credits by exclusive
        contribution.
      responses:
        {
          "200":
            { description: Deterministic Agent A/B/C replay, frontier, rewards, and replay hash },
        }
  /v1/challenges/emergency-supply:
    get:
      operationId: getEmergencySupplyCompetition
      description: Returns the Plan 5 demo round, availability flags, public rules, and counts.
      responses: { "200": { description: Emergency Supply competition lobby } }
  /v1/challenges/emergency-supply/starter-kit:
    get:
      operationId: downloadEmergencySupplyStarterKit
      description:
        Downloads the challenge manifest, vendors, failure scenarios, sample submission, and
        instructions as a ZIP archive.
      responses:
        "200":
          {
            description: Emergency Supply starter ZIP,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
  /v1/challenges/emergency-supply/leaderboard:
    get:
      operationId: getEmergencySupplyLeaderboard
      description:
        Recalculates the common frontier, dominated reasons, contribution, and reward preview
        from seed agents and latest participant revisions.
      responses: { "200": { description: Live frontier leaderboard } }
  /v1/challenges/emergency-supply/join:
    post:
      operationId: joinEmergencySupplyCompetition
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Authenticated participant created or restored },
          "401": { description: Privy token missing or invalid },
          "503": { description: Server authentication or durable storage unavailable },
        }
  /v1/challenges/emergency-supply/submissions:
    post:
      operationId: submitEmergencySupplyRevision
      security: [{ PrivyAccessToken: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan5SubmissionInput" } } },
        }
      responses:
        {
          "201": { description: Persisted and evaluated revision },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { description: Privy token missing or invalid },
        }
  /v1/challenges/emergency-supply/submissions/mine:
    get:
      operationId: getMyEmergencySupplySubmissions
      security: [{ PrivyAccessToken: [] }]
      responses: { "200": { description: Participant, revisions, and selected Final Entry } }
  /v1/challenges/emergency-supply/final-entry:
    put:
      operationId: selectEmergencySupplyFinalEntry
      security: [{ PrivyAccessToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Current Final Entry saved } }
  /v1/challenges/emergency-supply/demo-settlement:
    post:
      operationId: settleEmergencySupplyDemoReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Sepolia RewardPaid receipt persisted },
          "409": { description: No valid rewarding Final Entry },
          "503": { description: Capped Sepolia relayer unavailable },
        }
  /v1/challenges/emergency-supply/reward/mine:
    get:
      operationId: getMyEmergencySupplyReward
      security: [{ PrivyAccessToken: [] }]
      responses: { "200": { description: Current reward and transaction state } }
  /v1/disaster-response:
    get:
      operationId: getDisasterResponseScenario
      description:
        Returns the machine-readable Strategy v2 schema, evaluator and data versions, limits,
        metrics, constraints, 72-hour logistics network, public training scenarios, and committed
        final-scenario hash.
      responses: { "200": { description: Public disaster-response scenario } }
  /v1/disaster-response/evaluations:
    post:
      operationId: practiceDisasterResponseStrategy
      description: Runs the same deterministic evaluator and context used by Human UI and Agent
        submissions, without joining or persisting a revision. Display-only explanations are derived
        from measured outcomes and excluded from the compatible result hash.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DisasterResponseStrategy" } },
            },
        }
      responses:
        {
          "200":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CliDisasterPracticeResult" } },
                },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
        }
      parameters:
        - in: header
          name: X-Frontier-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Expected context; CLI always sends this precondition.
        - in: header
          name: X-Frontier-Runtime-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Required with a context precondition for Doctrine evaluations.
  /v1/challenges/disaster-response:
    get:
      operationId: getDisasterResponseCompetition
      description:
        Returns the Plan 6 instant demo round, storage/authentication/settlement availability,
        rules, and scenario.
      responses: { "200": { description: Disaster-response competition lobby } }
  /v1/challenges/disaster-response/starter-kit:
    get:
      operationId: downloadDisasterResponseStarterKit
      responses:
        "200":
          {
            description: Manifest,
            machine-readable evaluation contract,
            network,
            training scenarios,
            Strategy and future Policy schemas,
            sample strategy,
            baseline Agent,
            Agent submission example,
            and reproduction instructions as ZIP,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
  /v1/challenges/disaster-response/leaderboard:
    get:
      operationId: getDisasterResponseLeaderboard
      description:
        Compares selected Final Entries with public benchmarks and allocates independent Value
        Pools without producing an overall rank. Every allocation includes a deterministic
        qualification reason and formula.
      responses:
        { "200": { description: Three-axis frontier, Value Pool allocations, and reward previews } }
  /v1/challenges/disaster-response/value-pools:
    post:
      operationId: publishDisasterResponseValuePool
      description:
        Publishes one authenticated practice Protect a Region Value Pool. It allocates demo
        credits and does not fund or transfer Sepolia tokens.
      security: [{ PrivyAccessToken: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan6ValuePoolInput" } } },
        }
      responses:
        {
          "201": { description: Practice Value Pool manifest persisted },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { description: Privy token missing or invalid },
          "409": { description: This account already published its practice Value Pool },
        }
  /v1/challenges/disaster-response/join:
    post:
      operationId: joinDisasterResponseCompetition
      security:
        - PrivyAccessToken: []
          PrivyIdentityToken: []
        - CliSession: []
      responses:
        {
          "201":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliJoinResult" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
        }
  /v1/challenges/disaster-response/submissions:
    post:
      operationId: submitDisasterResponseRevision
      security:
        - PrivyAccessToken: []
          PrivyIdentityToken: []
        - CliSession: []
      parameters:
        - in: header
          name: X-Frontier-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Expected context; CLI always sends this precondition.
        - in: header
          name: X-Frontier-Runtime-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Required with a context precondition for Doctrine evaluations.
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
          description: Bind one immutable body to one operation; reuse on retry.
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/Plan6SubmissionInput" } } },
        }
      responses:
        {
          "201":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CliSubmissionResult" } },
                },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "200":
            {
              description: Existing submission returned for the identical idempotent operation,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CliSubmissionResult" } },
                },
            },
        }
  /v1/challenges/disaster-response/submissions/mine:
    get:
      operationId: getMyDisasterResponseSubmissions
      security:
        - PrivyAccessToken: []
          PrivyIdentityToken: []
        - CliSession: []
      responses:
        {
          "200":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliMySubmissions" } } },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
        }
  /v1/challenges/disaster-response/final-entry:
    put:
      operationId: selectDisasterResponseFinalEntry
      security:
        - PrivyAccessToken: []
          PrivyIdentityToken: []
        - CliSession: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [submissionId],
                      properties: { submissionId: { $ref: "#/components/schemas/Bytes32" } },
                      additionalProperties: false,
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CliFinalEntryResult" } },
                },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
        }
      parameters:
        - in: header
          name: X-Frontier-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Expected context; CLI always sends this precondition.
        - in: header
          name: X-Frontier-Runtime-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Required with a context precondition for Doctrine evaluations.
  /v1/challenges/disaster-response/demo-settlement:
    post:
      operationId: settleDisasterResponseDemoReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "201": { description: Committed Value Pool allocation paid and persisted },
          "409": { description: No valid rewarding Final Entry },
          "503": { description: Capped Sepolia relayer unavailable },
        }
  /v1/challenges/disaster-response/reward/mine:
    get:
      operationId: getMyDisasterResponseReward
      security: [{ PrivyAccessToken: [] }]
      responses:
        {
          "200":
            {
              description: Value Pool breakdown,
              allocation evidence,
              reward amount,
              recipient,
              and transaction state,
            },
        }
  /v1/calldata-compression:
    get:
      operationId: getCalldataCompressionScenario
      description: Returns the fixed batches, compiler and Cancun EVM rules, reference codecs, and
        measured baseline points.
      parameters:
        - name: contextId
          in: query
          schema: { type: string, enum: [public-transfer-mix, public-low-reuse] }
      responses: { "200": { description: Public calldata-compression scenario } }
  /v1/calldata-compression/evaluations:
    post:
      operationId: evaluateCalldataCodec
      description:
        Encodes every public batch, applies exact EIP-2028 byte pricing, executes Solidity
        runtime bytecode in a Cancun EVM, and compares both gas axes.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CalldataEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured codec with per-batch EVM evidence and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/microgrid-dispatch:
    get:
      operationId: getMicrogridDispatchScenario
      description: Returns the deterministic three-axis practice context and baselines.
      responses: { "200": { description: Public microgrid-dispatch scenario } }
  /v1/microgrid-dispatch/evaluations:
    post:
      operationId: evaluateMicrogridDispatch
      description: Measures cost, worst-case energy delivery, and carbon while enforcing all constraints.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MicrogridEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Measured three-axis outcome and result hash },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/rescue-room:
    get:
      operationId: getRescueRoomScenario
      description:
        Returns the deterministic Practice pack, ambiguous public alerts, curated Service Agent
        catalog, Reference Commander outcomes, Pareto frontier, and four independent Value Pool
        previews. Hidden incident state and practice seeds are omitted.
      responses: { "200": { description: Public Rescue Room Practice context } }
  /v1/rescue-room/starter-kit:
    get:
      operationId: downloadRescueRoomStarterKit
      description:
        Downloads the public alerts, Service Agent catalog, Doctrine and Commander Playbook
        schemas, deterministic and AI runtime contracts, starter Artifacts, and example requests.
        Hidden incident state is excluded.
      responses:
        {
          "200":
            {
              description: Rescue Room Controlled Practice Starter Kit,
              content: { application/zip: { schema: { type: string, format: binary } } },
            },
        }
  /v1/rescue-room/evaluations:
    post:
      operationId: evaluateRescueRoomPracticeEpisode
      description:
        Runs one Reference Commander against one deterministic simulated incident and returns
        its Action, Service Receipt, game-credit Payment, Protocol State, and outcome Replay. The
        true incident is revealed after the run.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RescueRoomEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Simulated Episode Replay and three-axis Practice outcome },
          "400": { $ref: "#/components/responses/BadRequest" },
        }
  /v1/rescue-room/doctrine-evaluations:
    post:
      operationId: evaluateRescueRoomDoctrine
      description:
        Runs one normalized deterministic Rescue Doctrine against one public Practice Episode.
        Returns reason-coded decisions, an Artifact hash, deterministic Action replay, and three
        independent outcomes.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RescueRoomDoctrineEvaluationInput" } },
            },
        }
      responses:
        {
          "200":
            {
              description: Validated response; independent metrics and evidence states are preserved,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CliRescuePracticeResult" } },
                },
            },
          "400":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "401":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "403":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "409":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "429":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
          "503":
            {
              description: Structured API error,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/CliApiError" } } },
            },
        }
      parameters:
        - in: header
          name: X-Frontier-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Expected context; CLI always sends this precondition.
        - in: header
          name: X-Frontier-Runtime-Context-Hash
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
          description: Required with a context precondition for Doctrine evaluations.
  /v1/rescue-room/commander-evaluations:
    post:
      operationId: evaluateRescueRoomAiCommander
      description:
        Runs one participant-authored Commander Playbook through the fixed OpenAI Agents SDK
        runtime against one public Practice Episode. Returns model and token provenance plus
        hash-bound Action evidence whose deterministic replay must reproduce the outcome. This is
        Controlled Practice and is not reward-eligible.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RescueRoomCommanderEvaluationInput" } },
            },
        }
      responses:
        {
          "200": { description: Simulated outcome with AI provenance and verified Action replay },
